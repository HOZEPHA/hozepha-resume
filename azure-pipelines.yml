trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
- group: static-web-app-secrets

steps:
- task: AzureStaticWebApp@0
  inputs:
    azure_static_web_apps_api_token: $(DEPLOYMENT_TOKEN)
    
    # Points strictly to your folder
    app_location: '/docs'          
    output_location: '/'       
    
    # CRITICAL FIX: Prevents engine from crawling parent directories
    is_static_export: true
    
    app_build_command: 'echo "Skipping framework check"'
