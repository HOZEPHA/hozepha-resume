trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
- group: static-web-app-secrets

steps:
- checkout: self
  clean: true

- task: AzureStaticWebApp@0
  inputs:
    azure_static_web_apps_api_token: $(DEPLOYMENT_TOKEN)
    
    # Tells the engine exactly where your index.html is located
    app_location: '/docs'          
    
    # Must match app_location when bypassing the build step
    output_location: '/docs'       
    
    # Bypasses the Oryx file-scanning bug completely
    skip_app_build: true
