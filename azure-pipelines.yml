trigger:
- main  # Change to your default branch name if different

pool:
  vmImage: ubuntu-latest

variables:
- group: static-web-app-secrets # Links your secret token

steps:
- task: AzureStaticWebApp@0
  inputs:
    # Authentication
    azure_static_web_apps_api_token: $(DEPLOYMENT_TOKEN)
    
    # Deployment Directory
    app_location: '/'          # Location of your index.html
    output_location: '/'       # Same folder since there is no build step
    
    # Skip Build Frameworks
    app_build_command: 'echo "Skipping build for plain HTML"'
